version: "3.9"

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Kept in sync with the api service below — both default to "atc", so an
      # existing deployment is unaffected. Change them only before the first
      # start: db_data is created once and is not renamed afterwards.
      MARIADB_DATABASE: ${DB_NAME:-atc}
      MARIADB_USER: ${DB_USER:-atc}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"${DB_USER:-atc}\" -p\"${DB_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atc

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atc

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Database. The API reads these individually — see apps/api/src/config.ts.
      # DB_NAME, DB_USER and DB_PASSWORD are required: the API throws
      # "Missing required environment variable" and exits without them.
      # The host is the service name on the atc network, not localhost.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atc}
      DB_USER: ${DB_USER:-atc}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis. Same rule: service name, and the password must be passed or the
      # API cannot authenticate against a redis-server started with --requirepass.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ATC_API_TOKEN: ${ATC_API_TOKEN}
      ATC_SERVER_TOKEN: ${ATC_SERVER_TOKEN}
      ATC_SERVER_ID: ${ATC_SERVER_ID:-atc-main-01}
      PORT: 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - atc

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - atc

volumes:
  db_data:
  redis_data:

networks:
  atc:
    driver: bridge
