version: "3.9"

# Development overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    ports:
      - "3306:3306"

  redis:
    # Keep the password in dev. docker-compose.yml's healthcheck runs
    # `redis-cli --pass ...`, and this file does not replace it — so a Redis
    # started without --requirepass answers AUTH with an error, the healthcheck
    # never goes healthy, and the api service (depends_on: service_healthy)
    # never starts. Command, healthcheck and the API's REDIS_PASSWORD must agree.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"${REDIS_PASSWORD:-changeme_redis}\" ping"]
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: base
    command: ["node", "--watch", "apps/api/src/index.ts"]
    volumes:
      - ../apps/api/src:/app/apps/api/src:ro
      - ../packages:/app/packages:ro
    environment:
      NODE_ENV: development
      # DB_HOST/DB_PORT/DB_NAME/DB_USER and REDIS_HOST/REDIS_PORT come from
      # docker-compose.yml. Only the secrets are re-declared here, with dev
      # defaults, so `up` works without an infra/.env.
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      ATC_API_TOKEN: ${ATC_API_TOKEN:-dev_token}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx not included in dev — API exposed directly on port 3000
  nginx:
    profiles:
      - disabled
